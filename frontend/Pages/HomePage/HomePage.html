
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      i {
        width: 35px;
        font-size: 21px;
      }

      li {
        height: fit-content;
        list-style: none;
        margin: 0;
      }

      .container {
        width: 95%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 10px;
        margin: auto;
      }

      .left_side {
        position: sticky;
        top: 10px;
        align-self: start;
      }

      .right_side {
        position: sticky;
        top: 10px;
        align-self: start;
      }

      .current_user {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        margin-bottom: 6px;
      }

      .current_user img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        background: #cfd3d8;
      }

      .current_user span {
        font-weight: 600;
        font-family: sans-serif;
      }

      .left_link {
        display: grid;
        grid-template-rows: repeat(8, 60px);
        align-items: center;
        list-style: none;
        margin-left: 10px;
        color: #161414;
        font-weight: 600;
        font-family: sans-serif;
      }

      .left_link a {
        display: flex;
        text-decoration: none;
        color: black;
      }

      .add_post {
        height: 18vh;
      }

      .post {
        height: 82vh;
        display: grid;
        grid-template-rows: 1fr 5fr 1fr;
        border: 1px solid #b3acac;
        border-radius: 6px;
        margin-top: 10px;
      }

      .logo_profile {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        overflow: hidden;
        margin-left: 10px;
        margin-top: 10px;
        grid-row: 1 / 3;
        background-color: beige;
      }

      .post_header {
        display: grid;
        grid-template-columns: 100px 1fr;
        grid-template-rows: 68px 50px;
      }

      .prag {
        grid-column: 2;
        overflow: hidden;
        padding-top: 6px;
        padding-left: 13px;
      }

      .post_header_right {
        width: fit-content;
        margin-top: 20px;
      }

      .post_img {
        overflow: hidden;
        padding: 14px 14px 0 14px;
      }

      .post_active {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }

      .post_active li {
        width: 100px;
        text-align: center;
      }

      .friends_list {
        line-height: 34px;
        font-size: 18px;
        width: 90%;
        margin: auto;
      }

      .friends_list li {
        margin-top: 5px;
        padding: 0px 10px 0 10px;
        border-radius: 5px;
        width: fit-content;
      }

      .state-msg {
        text-align: center;
        color: #65676b;
        padding: 20px;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left_side">
        <div class="current_user">
          <img id="currentUserImg" src="../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg" alt="">
          <span id="currentUserName">...</span>
        </div>
        <div class="left_link">
          <a href="HomePage.html">
            <i class="fa-solid fa-house"></i>
            <li>home</li>
          </a>
          <a href="">
            <i class="fa-solid fa-hashtag"></i>
            <li>explore</li>
          </a>
          <a href="">
            <i class="fa-regular fa-bell"></i>
            <li>notifications</li>
          </a>
          <a href="../ChatsPage/ChatsPage.html">
            <i class="fa-regular fa-envelope"></i>
            <li>messages</li>
          </a>
          <a href="">
            <i class="fa-regular fa-bookmark"></i>
            <li>bookmarks</li>
          </a>
          <a href="">
            <i class="fa-solid fa-list"></i>
            <li>lists</li>
          </a>
          <a href="../ProfilePage/ProfileInfo.html">
            <i class="fa-regular fa-circle-user"></i>
            <li>profile</li>
          </a>
          <a href="#" id="logoutLink">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <li>logout</li>
          </a>
        </div>
      </div>

      <div class="center_side">
        <div class="add_post"></div>
        <div id="postsContainer">
          <div class="state-msg" id="stateMsg">Loading posts...</div>
        </div>
      </div>

      <div class="right_side">
        <h2>friends</h2>
        <div class="friends_list" id="friendsList">
          <div class="state-msg" id="friendsMsg">Loading...</div>
        </div>
      </div>
    </div>

    <script type="module">
      import { getHomeData } from "../../api.js";

      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "../LoginPage/Login.html";
      }

      document.getElementById("logoutLink").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.removeItem("token");
        window.location.href = "../LoginPage/Login.html";
      });

      async function loadHome() {
        try {
          const response = await fetch(getHomeData, {
            method: "GET",
            headers: { "Authorization": token }
          });

          const data = await response.json();

          if (data.status !== "success") {
            document.getElementById("stateMsg").textContent = data.message || "Failed to load data";
            document.getElementById("friendsMsg").textContent = "";
            return;
          }
          renderCurrentUser(data.user_info || []);

          renderPosts(data.posts || []);
          renderFriends(data.friends || []);
        } catch (err) {
          document.getElementById("stateMsg").textContent = "Server connection error";
          document.getElementById("friendsMsg").textContent = "";
          console.error(err);
        }
      }

      function renderCurrentUser(user) {
        if (!user) return;
        document.getElementById("currentUserImg").src =  "../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg";
        document.getElementById("currentUserName").textContent =
          (user.first_name || "") + " " + (user.last_name || "");
      }

      function renderPosts(posts) {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";

        if (posts.length === 0) {
          container.innerHTML = '<div class="state-msg">No posts yet, write the first one!</div>';
          return;
        }
        

        posts.forEach((post) => {
          const div = document.createElement("div");
          div.className = "post";
          div.innerHTML = `
            <div class="post_header">
              <div class="logo_profile">
                <img style="width: stretch; height: stretch; object-fit: cover"
                     src="${post.profile_picture || 'default_avatar.png'}" alt="">
              </div>
              <div class="post_header_right">
                <h3 class="name">${(post.first_name || '') + ' ' + (post.last_name || '')}</h3>
              </div>
              <div class="prag">
                <p style="margin: 0; letter-spacing: 1px; font-size: large">
                  ${escapeHtml(post.content || '')}
                </p>
              </div>
            </div>
            ${post.image ? `
            <div class="post_img">
              <img src="${post.image}" alt=""
                   style="width: 100%; height: 100%; border-radius: 8px; object-fit: cover;">
            </div>` : '<div class="post_img"></div>'}
            <div class="post_active">
              <li><i class="fa-regular fa-comment"></i></li>
              <li><i class="fa-solid fa-retweet"></i></li>
              <li><i class="fa-regular fa-heart"></i></li>
              <li><i class="fa-solid fa-arrow-up-from-bracket"></i></li>
            </div>
          `;
          container.appendChild(div);
        });
      }

      function renderFriends(friends) {
        const container = document.getElementById("friendsList");
        container.innerHTML = "";

        if (friends.length === 0) {
          container.innerHTML = '<div class="state-msg">No friends yet</div>';
          return;
        }

        friends.forEach((friend) => {
          const li = document.createElement("li");
          li.textContent = (friend.first_name || '') + " " + (friend.last_name || '');
          container.appendChild(li);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      loadHome();
    </script>
  </body>
</html>
