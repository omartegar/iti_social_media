<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #f4f6f8;
        --card-bg: #ffffff;
        --text-main: #1c1e21;
        --text-muted: #65676b;
        --accent-color: #1877f2;
        --accent-hover: #166fe5;
        --border-color: #e4e6eb;
        --radius: 12px;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-color);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text-main);
      }

      i {
        width: 30px;
        font-size: 20px;
        text-align: center;
      }

      li {
        height: fit-content;
        list-style: none;
        margin: 0;
      }

      .container {
        width: 90%;
        max-width: 1280px;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr 280px;
        gap: 24px;
        margin: auto;
        padding-top: 20px;
      }

      .left_side,
      .right_side {
        position: sticky;
        top: 20px;
        align-self: start;
      }

      .current_user {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
        margin-bottom: 12px;
      }

      .current_user img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        background: #cfd3d8;
      }

      .current_user span {
        font-weight: 600;
        font-size: 15px;
      }

      .left_link {
        display: flex;
        flex-direction: column;
        gap: 6px;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .left_link a {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text-main);
        padding: 12px 16px;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 15px;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .left_link a:hover {
        background: var(--card-bg);
        color: var(--accent-color);
        box-shadow: var(--shadow);
      }

      .add_post {
        min-height: 70px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--text-muted);
        font-size: 15px;
        font-weight: 500;
        background: var(--card-bg);
        box-shadow: var(--shadow);
        transition:
          background 0.2s,
          transform 0.1s;
      }

      .add_post:hover {
        background: #f8f9fa;
        transform: translateY(-1px);
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-box {
        background: var(--card-bg);
        width: 90%;
        max-width: 500px;
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
        color: var(--text-muted);
        transition: color 0.2s;
      }

      .modal-close:hover {
        color: var(--text-main);
      }

      #createPostForm textarea {
        width: 100%;
        min-height: 120px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        font-size: 15px;
        font-family: inherit;
        resize: vertical;
        box-sizing: border-box;
        background: #fafafa;
      }

      #createPostForm textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        background: #fff;
      }

      #createPostForm input[type="file"] {
        margin-top: 14px;
        font-size: 14px;
      }

      #createPostForm button[type="submit"] {
        margin-top: 16px;
        width: 100%;
        background: var(--accent-color);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      #createPostForm button[type="submit"]:hover {
        background: var(--accent-hover);
      }

      #createPostForm button[type="submit"]:disabled {
        background: #9cc0f5;
        cursor: not-allowed;
      }

      .error {
        color: #d93025;
        font-size: 13px;
        margin-top: 8px;
      }

      .post {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        margin-top: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .post.has-image {
        min-height: auto;
      }

      .logo_profile {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        background-color: #eee;
      }

      .post_header {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        padding: 16px;
        gap: 12px;
        align-items: flex-start;
      }

      .prag {
        width: 100%;
        padding: 4px 0 0 0;
        overflow-wrap: anywhere;
      }

      .prag p {
        font-size: 15px !important;
        line-height: 1.5;
        letter-spacing: normal !important;
        color: var(--text-main);
      }

      .post_header_right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin-top: 2px !important;
      }

      .post_header_right h3.name {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      .post_date {
        display: block;
        margin-top: 2px;
        color: var(--text-muted);
        font-size: 12px;
      }

      .delete_post_button {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: var(--text-muted);
        background: transparent;
        cursor: pointer;
        transition:
          color 0.2s,
          background 0.2s,
          transform 0.2s;
      }

      .delete_post_button:hover {
        color: #d93025;
        background: #fff0f0;
        transform: scale(1.05);
      }

      .delete_post_button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .delete_post_button i {
        width: auto;
        font-size: 15px;
      }

      .confirm_message {
        margin: 0 0 20px;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .confirm_actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .confirm_actions button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .confirm_cancel {
        color: var(--text-main);
        background: #f0f2f5;
      }

      .confirm_delete {
        color: #fff;
        background: #d93025;
      }

      .confirm_delete:hover {
        background: #b42318;
      }

      .post_img {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-height: 350px;
        background: #f8f9fa;
      }

      .post_img img {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        max-height: 350px;
        object-fit: cover;
        display: block;
      }

      .post_image_status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--text-muted);
        font-size: 14px;
        z-index: 1;
      }

      .post_active {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid var(--border-color);
        background: #fafafa;
      }

      .like_button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 20px;
        padding: 6px 16px;
        color: var(--text-muted);
        background: #edf0f2;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .like_button:hover {
        background: #ffe8ed;
        color: #e0245e;
      }

      .like_button.liked {
        color: #e0245e;
        background: #ffe8ed;
      }

      .like_button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .like_button i {
        width: auto;
        font-size: 16px;
      }

      .like_status {
        margin-left: 10px;
        color: #d93025;
        font-size: 12px;
      }

      .right_side h2 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: capitalize;
        margin: 0 0 12px 4px;
      }

      .friends_list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .friend_item {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 10px 12px;
        border-radius: var(--radius);
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
      }

      .friend_item img {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border-radius: 50%;
        object-fit: cover;
        background: #cfd3d8;
      }

      .friend_item_info {
        min-width: 0;
      }

      .friend_item_name {
        margin: 0;
        overflow: hidden;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .friend_item_status {
        margin: 2px 0 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .state-msg {
        text-align: center;
        color: var(--text-muted);
        padding: 24px;
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
      }

      @media (max-width: 800px) {
        .container {
          grid-template-columns: 60px minmax(0, 1fr);
          gap: 12px;
          padding-top: 12px;
        }

        .right_side {
          display: none;
        }

        .left_link a li {
          display: none;
        }

        .left_link a {
          justify-content: center;
          padding: 12px;
        }

        .current_user span {
          display: none;
        }

        .current_user {
          padding: 6px;
          justify-content: center;
        }
      }

      @media (min-width: 801px) and (max-width: 1050px) {
        .container {
          grid-template-columns: 180px minmax(0, 2fr) 200px;
          gap: 16px;
        }

        .friend_item {
          padding: 8px;
        }

        .friend_item img {
          width: 32px;
          height: 32px;
          flex-basis: 32px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left_side">
        <div class="current_user">
          <img
            id="currentUserImg"
            src="../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg"
            alt=""
          />
          <span id="currentUserName">Loading...</span>
        </div>
        <div class="left_link">
          <a href="HomePage.html">
            <i class="fa-solid fa-house"></i>
            <li>home</li>
          </a>
          <a href="../ChatsPage/ChatsPage.html">
            <i class="fa-regular fa-envelope"></i>
            <li>messages</li>
          </a>
          <a href="../ProfilePage/ProfileInfo.html">
            <i class="fa-regular fa-circle-user"></i>
            <li>profile</li>
          </a>
          <a href="#" id="logoutLink">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <li>logout</li>
          </a>
        </div>
      </div>

      <div class="center_side">
        <div class="add_post" id="addPostTrigger">
          <span>What's on your mind?</span>
        </div>
        <div id="postsContainer">
          <div class="state-msg" id="stateMsg">Loading posts...</div>
        </div>
      </div>

      <div class="right_side">
        <h2>friends</h2>
        <div class="friends_list" id="friendsList">
          <div class="state-msg" id="friendsMsg">Loading...</div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="createPostOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Create Post</h3>
          <button type="button" id="closeModalBtn" class="modal-close">
            &times;
          </button>
        </div>
        <form id="createPostForm">
          <textarea id="postText" placeholder="What's on your mind?"></textarea>
          <input type="file" id="postImage" accept="image/*" />
          <div class="error" id="createPostError"></div>
          <button type="submit" id="createPostSubmitBtn">Post</button>
        </form>
      </div>
    </div>

    <div
      class="modal-overlay"
      id="deletePostOverlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deletePostTitle"
    >
      <div class="modal-box">
        <div class="modal-header">
          <h3 id="deletePostTitle">Delete post?</h3>
          <button
            type="button"
            class="modal-close"
            id="cancelDeleteBtn"
            aria-label="Close"
          >
            &times;
          </button>
        </div>
        <p class="confirm_message" id="deletePostMessage">
          This post will be permanently removed.
        </p>
        <div class="confirm_actions">
          <button type="button" class="confirm_cancel" id="cancelDeleteAction">
            Cancel
          </button>
          <button type="button" class="confirm_delete" id="confirmDeleteBtn">
            Delete post
          </button>
        </div>
      </div>
    </div>

    <script type="module">
      import {
        getHomeData,
        createPost,
        createLike,
        deleteLike,
        deletePost,
      } from "../../api.js";
      const UPLOADS_BASE = "https://iti-api.wasmer.app:443/assets/images/";
      const DEFAULT_AVATAR =
        "../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg";

      function buildImageUrl(filename) {
        if (!filename || filename === "default_avatar.png")
          return DEFAULT_AVATAR;
        if (
          filename.startsWith("http://") ||
          filename.startsWith("https://") ||
          filename.startsWith("../")
        ) {
          return filename;
        }
        return UPLOADS_BASE + filename;
      }

      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "../LoginPage/Login.html";
      }

      document.getElementById("logoutLink").addEventListener("click", (e) => {
        e.preventDefault();
        const confirmed = confirm("Are you sure to log out?");
        if (!confirmed) return;
        localStorage.removeItem("token");
        window.location.href = "../LoginPage/Login.html";
      });

      async function loadHome() {
        try {
          const response = await fetch(getHomeData, {
            method: "GET",
            headers: { Authorization: token },
          });

          const data = await response.json();
          console.log("Full API Data:", data);

          if (data.status !== "success") {
            document.getElementById("stateMsg").textContent =
              data.message || "Failed to load data";
            document.getElementById("friendsMsg").textContent = "";
            document.getElementById("currentUserName").textContent = "User";
            return;
          }

          const currentUserId = data.my_id || null;
          const friends = data.friends || [];

          const currentUser =
            friends.find(
              (f) => String(f.id ?? f.user_id) === String(currentUserId),
            ) ||
            data.user_info ||
            null;

          const usersById = buildUsersMap(currentUser, friends);

          renderCurrentUser(currentUser);
          renderPosts(data.posts || [], usersById, currentUserId);
          renderFriends(friends, currentUserId);
        } catch (err) {
          document.getElementById("stateMsg").textContent =
            "Server connection error";
          document.getElementById("friendsMsg").textContent = "";
          document.getElementById("currentUserName").textContent = "User";
          console.error(err);
        }
      }

      function buildUsersMap(currentUser, friends) {
        const map = {};
        if (
          currentUser &&
          (currentUser.id != null || currentUser.user_id != null)
        ) {
          const id = currentUser.id ?? currentUser.user_id;
          map[id] = currentUser;
        }
        friends.forEach((friend) => {
          const id = friend.id ?? friend.user_id;
          if (id != null) map[id] = friend;
        });
        return map;
      }

      function renderCurrentUser(user) {
        const userNameElem = document.getElementById("currentUserName");
        const userImgElem = document.getElementById("currentUserImg");

        if (!user) {
          userNameElem.textContent = "User";
          userImgElem.src = DEFAULT_AVATAR;
          return;
        }

        userImgElem.src = buildImageUrl(user.profile_picture);
        userImgElem.onerror = () => {
          userImgElem.src = DEFAULT_AVATAR;
        };

        const firstName = user.first_name || "";
        const lastName = user.last_name || "";
        const fullName = `${firstName} ${lastName}`.trim();

        userNameElem.textContent =
          fullName !== "" ? fullName : user.name || user.username || "User";
      }

      function renderPosts(posts, usersById, currentUserId) {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";

        if (posts.length === 0) {
          container.innerHTML =
            '<div class="state-msg">No posts yet, write the first one!</div>';
          return;
        }

        posts.forEach((post) => {
          const author = usersById[post.user_id] || {};
          const firstName = post.first_name || author.first_name || "";
          const lastName = post.last_name || author.last_name || "";
          const authorName =
            (firstName + " " + lastName).trim() ||
            author.name ||
            author.username ||
            "Unknown";
          const authorPic = buildImageUrl(
            post.profile_picture || author.profile_picture,
          );
          const postImage = post.image ? buildImageUrl(post.image) : null;

          const isLikedByMe =
            post.you_liked !== undefined
              ? Boolean(post.you_liked)
              : Number(post.liked_by_me) === 1;

          const div = document.createElement("div");
          div.className = postImage ? "post has-image" : "post";
          const canDeletePost = String(post.user_id) === String(currentUserId);
          div.innerHTML = `
            <div class="post_header">
              <div class="logo_profile">
                <img style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;"
                     src="${authorPic}"
                     onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}';"
                     alt="">
              </div>
              <div class="post_header_right">
                <h3 class="name">${escapeHtml(authorName)}</h3>
                <span class="post_date">${escapeHtml(formatPostDate(post.created_at))}</span>
              </div>
              ${
                canDeletePost
                  ? `
              <button class="delete_post_button" type="button" aria-label="Delete post" title="Delete post">
                <i class="fa-solid fa-trash"></i>
              </button>`
                  : ""
              }
              <div class="prag">
                <p style="margin: 0; letter-spacing: 1px; font-size: large">
                  ${escapeHtml(post.content || "")}
                </p>
              </div>
            </div>
            ${
              postImage
                ? `
            <div class="post_img">
                <span class="post_image_status">Loading image...</span>
                <img src="${postImage}" alt="Post image"
                  onload="this.previousElementSibling.style.display = 'none';"
                  onerror="this.hidden = true; this.previousElementSibling.textContent = 'Image not available';">
            </div>`
                : ""
            }
            <div class="post_active">
              <button class="like_button ${isLikedByMe ? "liked" : ""}"
                      type="button"
                      data-post-id="${post.id}"
                      data-liked="${isLikedByMe}"
                      data-likes="${Number(post.likes) || 0}"
                      aria-pressed="${isLikedByMe}">
                <i class="fa-${isLikedByMe ? "solid" : "regular"} fa-heart"></i>
                <span>${Number(post.likes) || 0} ${Number(post.likes) === 1 ? "like" : "likes"}</span>
              </button>
              <span class="like_status" aria-live="polite"></span>
            </div>
          `;
          container.appendChild(div);
          div
            .querySelector(".like_button")
            .addEventListener("click", toggleLike);
          div
            .querySelector(".delete_post_button")
            ?.addEventListener("click", () => {
              openDeletePostDialog(post.id, div);
            });
        });
      }

      let pendingDelete = null;

      function openDeletePostDialog(postId, postElement) {
        pendingDelete = { postId, postElement };
        document.getElementById("deletePostMessage").textContent =
          "This post and its image, if available, will be permanently removed.";
        document.getElementById("deletePostOverlay").classList.add("open");
      }

      function closeDeletePostDialog() {
        pendingDelete = null;
        document.getElementById("deletePostOverlay").classList.remove("open");
      }

      async function confirmDeletePost() {
        if (!pendingDelete) return;

        const { postId, postElement } = pendingDelete;
        const confirmButton = document.getElementById("confirmDeleteBtn");
        confirmButton.disabled = true;
        confirmButton.textContent = "Deleting...";

        try {
          const response = await fetch(deletePost, {
            method: "DELETE",
            headers: {
              Authorization: localStorage.getItem("token"),
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ id: postId }),
          });
          const data = await response.json();

          if (data.status !== "success") {
            throw new Error(data.message || "The post could not be deleted");
          }

          postElement.remove();
          const postsContainer = document.getElementById("postsContainer");
          if (!postsContainer.querySelector(".post")) {
            postsContainer.innerHTML =
              '<div class="state-msg">No posts yet, write the first one!</div>';
          }
          closeDeletePostDialog();
        } catch (error) {
          document.getElementById("deletePostMessage").textContent =
            error.message;
        } finally {
          confirmButton.disabled = false;
          confirmButton.textContent = "Delete post";
        }
      }

      async function toggleLike(event) {
        const button = event.currentTarget;
        const postId = button.dataset.postId;
        const wasLiked = button.dataset.liked === "true";
        const status = button.nextElementSibling;
        const count = Number(button.dataset.likes) || 0;

        button.disabled = true;
        status.textContent = "";

        try {
          const response = await fetch(wasLiked ? deleteLike : createLike, {
            method: wasLiked ? "DELETE" : "POST",
            headers: {
              Authorization: localStorage.getItem("token"),
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ post_id: postId }),
          });
          const data = await response.json();

          if (data.status !== "success") {
            throw new Error(data.message || "Unable to update like");
          }

          const isLiked = !wasLiked;
          const newCount = Math.max(0, count + (isLiked ? 1 : -1));
          button.dataset.liked = String(isLiked);
          button.dataset.likes = String(newCount);
          button.classList.toggle("liked", isLiked);
          button.setAttribute("aria-pressed", String(isLiked));
          button.innerHTML = `<i class="fa-${isLiked ? "solid" : "regular"} fa-heart"></i><span>${newCount} ${newCount === 1 ? "like" : "likes"}</span>`;
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      }

      function formatPostDate(value) {
        if (!value) return "Date not available";

        const date = new Date(String(value).replace(" ", "T"));
        if (Number.isNaN(date.getTime())) return "Date not available";

        return new Intl.DateTimeFormat(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        }).format(date);
      }

      function renderFriends(friends, currentUserId) {
        const container = document.getElementById("friendsList");
        container.innerHTML = "";

        const filteredFriends = friends.filter((friend) => {
          const friendId = friend.id ?? friend.user_id;
          return String(friendId) !== String(currentUserId);
        });

        if (filteredFriends.length === 0) {
          container.innerHTML = '<div class="state-msg">No friends yet</div>';
          return;
        }

        filteredFriends.forEach((friend) => {
          const friendName =
            `${friend.first_name || ""} ${friend.last_name || ""}`.trim();
          const displayName = friendName || friend.name || "Friend";
          const friendImage = buildImageUrl(friend.profile_picture);
          const friendCard = document.createElement("div");
          friendCard.className = "friend_item";
          friendCard.innerHTML = `
            <img src="${friendImage}" alt="${escapeHtml(displayName)} profile picture">
            <div class="friend_item_info">
              <p class="friend_item_name">${escapeHtml(displayName)}</p>
              <p class="friend_item_status">Available to chat</p>
            </div>`;

          const image = friendCard.querySelector("img");
          image.addEventListener(
            "error",
            () => {
              image.src = DEFAULT_AVATAR;
            },
            { once: true },
          );

          container.appendChild(friendCard);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      const overlay = document.getElementById("createPostOverlay");
      const openModalBtn = document.getElementById("addPostTrigger");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const createPostForm = document.getElementById("createPostForm");
      const createPostError = document.getElementById("createPostError");
      const createPostSubmitBtn = document.getElementById(
        "createPostSubmitBtn",
      );
      const deletePostOverlay = document.getElementById("deletePostOverlay");
      const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");
      const cancelDeleteAction = document.getElementById("cancelDeleteAction");
      const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

      openModalBtn.addEventListener("click", () => {
        overlay.classList.add("open");
      });

      closeModalBtn.addEventListener("click", closeModal);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
      });

      function closeModal() {
        overlay.classList.remove("open");
        createPostForm.reset();
        createPostError.textContent = "";
      }

      cancelDeleteBtn.addEventListener("click", closeDeletePostDialog);
      cancelDeleteAction.addEventListener("click", closeDeletePostDialog);
      confirmDeleteBtn.addEventListener("click", confirmDeletePost);
      deletePostOverlay.addEventListener("click", (event) => {
        if (event.target === deletePostOverlay) closeDeletePostDialog();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeDeletePostDialog();
        }
      });

      createPostForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        createPostError.textContent = "";

        const text = document.getElementById("postText").value.trim();
        const imageFile = document.getElementById("postImage").files[0];

        if (!text && !imageFile) {
          createPostError.textContent =
            "Write something or upload an image first";
          return;
        }

        createPostSubmitBtn.disabled = true;
        createPostSubmitBtn.textContent = "Posting...";

        try {
          const fd = new FormData();
          fd.append("text", text);
          if (imageFile) fd.append("image", imageFile);

          const response = await fetch(createPost, {
            method: "POST",
            headers: { Authorization: token },
            body: fd,
          });

          const data = await response.json();

          if (data.status === "success") {
            closeModal();
            loadHome();
          } else {
            createPostError.textContent =
              data.message || "Something went wrong, try again";
          }
        } catch (err) {
          createPostError.textContent = "Server connection error";
          console.error(err);
        } finally {
          createPostSubmitBtn.disabled = false;
          createPostSubmitBtn.textContent = "Post";
        }
      });

      loadHome();
    </script>
  </body>
</html>
