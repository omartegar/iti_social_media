<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      i {
        width: 35px;
        font-size: 21px;
      }

      li {
        height: fit-content;
        list-style: none;
        margin: 0;
      }

      .container {
        width: 95%;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 10px;
        margin: auto;
      }

      .left_side {
        position: sticky;
        top: 10px;
        align-self: start;
      }

      .right_side {
        position: sticky;
        top: 10px;
        align-self: start;
      }

      .current_user {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        margin-bottom: 6px;
      }

      .current_user img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        background: #cfd3d8;
      }

      .current_user span {
        font-weight: 600;
        font-family: sans-serif;
      }

      .left_link {
        display: grid;
        grid-template-rows: repeat(8, 60px);
        align-items: center;
        list-style: none;
        margin-left: 10px;
        color: #161414;
        font-weight: 600;
        font-family: sans-serif;
      }

      .left_link a {
        display: flex;
        text-decoration: none;
        color: black;
      }

      .add_post {
        height: 18vh;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border: 1px solid #b3acac;
        border-radius: 6px;
        cursor: pointer;
        font-family: sans-serif;
        color: #65676b;
        font-size: 16px;
        background: #fff;
      }

      .add_post:hover {
        background: #f0f2f5;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-box {
        background: #fff;
        width: 90%;
        max-width: 480px;
        border-radius: 10px;
        padding: 20px;
        font-family: sans-serif;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .modal-header h3 {
        margin: 0;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        color: #65676b;
      }

      #createPostForm textarea {
        width: 100%;
        min-height: 110px;
        border: 1px solid #dcdfe3;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        font-family: inherit;
        resize: vertical;
        box-sizing: border-box;
      }

      #createPostForm textarea:focus {
        outline: none;
        border-color: #1877f2;
      }

      #createPostForm input[type="file"] {
        margin-top: 10px;
      }

      #createPostForm button[type="submit"] {
        margin-top: 12px;
        width: 100%;
        background: #1877f2;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }

      #createPostForm button[type="submit"]:disabled {
        background: #9cc0f5;
        cursor: not-allowed;
      }

      .error {
        color: #d93025;
        font-size: 14px;
        margin-top: 8px;
      }

      .post {
        height: 82vh;
        display: grid;
        grid-template-rows: 1fr 5fr 1fr;
        border: 1px solid #b3acac;
        border-radius: 6px;
        margin-top: 10px;
      }

      .logo_profile {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        overflow: hidden;
        margin-left: 10px;
        margin-top: 10px;
        grid-row: 1 / 3;
        background-color: beige;
      }

      .post_header {
        display: grid;
        grid-template-columns: 100px 1fr;
        grid-template-rows: 68px 50px;
      }

      .prag {
        grid-column: 2;
        overflow: hidden;
        padding-top: 6px;
        padding-left: 13px;
      }

      .post_header_right {
        width: fit-content;
        margin-top: 20px;
      }

      .post_img {
        overflow: hidden;
        padding: 14px 14px 0 14px;
      }

      .post_active {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
      }

      .post_active li {
        width: 100px;
        text-align: center;
      }

      .friends_list {
        line-height: 34px;
        font-size: 18px;
        width: 90%;
        margin: auto;
      }

      .friends_list li {
        margin-top: 5px;
        padding: 0px 10px 0 10px;
        border-radius: 5px;
        width: fit-content;
      }

      .state-msg {
        text-align: center;
        color: #65676b;
        padding: 20px;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="left_side">
        <div class="current_user">
          <img id="currentUserImg" src="../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg" alt="">
          <span id="currentUserName">Loading...</span>
        </div>
        <div class="left_link">
          <a href="HomePage.html">
            <i class="fa-solid fa-house"></i>
            <li>home</li>
          </a>
          <a href="">
            <i class="fa-solid fa-hashtag"></i>
            <li>explore</li>
          </a>
          <a href="">
            <i class="fa-regular fa-bell"></i>
            <li>notifications</li>
          </a>
          <a href="../ChatsPage/ChatsPage.html">
            <i class="fa-regular fa-envelope"></i>
            <li>messages</li>
          </a>
          <a href="">
            <i class="fa-regular fa-bookmark"></i>
            <li>bookmarks</li>
          </a>
          <a href="">
            <i class="fa-solid fa-list"></i>
            <li>lists</li>
          </a>
          <a href="../ProfilePage/ProfileInfo.html">
            <i class="fa-regular fa-circle-user"></i>
            <li>profile</li>
          </a>
          <a href="#" id="logoutLink">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <li>logout</li>
          </a>
        </div>
      </div>

      <div class="center_side">
        <div class="add_post" id="addPostTrigger">
          <span>What's on your mind?</span>
        </div>
        <div id="postsContainer">
          <div class="state-msg" id="stateMsg">Loading posts...</div>
        </div>
      </div>

      <div class="right_side">
        <h2>friends</h2>
        <div class="friends_list" id="friendsList">
          <div class="state-msg" id="friendsMsg">Loading...</div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="createPostOverlay">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Create Post</h3>
          <button type="button" id="closeModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="createPostForm">
          <textarea id="postText" placeholder="What's on your mind?"></textarea>
          <input type="file" id="postImage" accept="image/*">
          <div class="error" id="createPostError"></div>
          <button type="submit" id="createPostSubmitBtn">Post</button>
        </form>
      </div>
    </div>

    <script type="module">
      import { getHomeData, createPost } from "../../api.js";
      const UPLOADS_BASE = "https://iti-api.wasmer.app:443/uploads/";
      const DEFAULT_AVATAR = "../ProfilePage/images/f547d800625af9056d62efe8969aeea0.jpg";

      function buildImageUrl(filename) {
        if (!filename || filename === "default_avatar.png") return DEFAULT_AVATAR;
        if (filename.startsWith("http://") || filename.startsWith("https://") || filename.startsWith("../")) {
          return filename;
        }
        return UPLOADS_BASE + filename;
      }

      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "../LoginPage/Login.html";
      }

      document.getElementById("logoutLink").addEventListener("click", (e) => {
        e.preventDefault();
        const confirmed = confirm("Are you sure to log out?");
        if (!confirmed) return;
        localStorage.removeItem("token");
        window.location.href = "../LoginPage/Login.html";
      });

      async function loadHome() {
        try {
          const response = await fetch(getHomeData, {
            method: "GET",
            headers: { "Authorization": token }
          });

          const data = await response.json();
          console.log("Full API Data:", data);

          if (data.status !== "success") {
            document.getElementById("stateMsg").textContent = data.message || "Failed to load data";
            document.getElementById("friendsMsg").textContent = "";
            document.getElementById("currentUserName").textContent = "User";
            return;
          }

          const currentUserId = data.my_id || null;
          const friends = data.friends || [];

          const currentUser = friends.find(f => String(f.id ?? f.user_id) === String(currentUserId))
                            || data.user_info 
                            || null;

          const usersById = buildUsersMap(currentUser, friends);

          renderCurrentUser(currentUser);
          renderPosts(data.posts || [], usersById, currentUserId);
          renderFriends(friends, currentUserId);
        } catch (err) {
          document.getElementById("stateMsg").textContent = "Server connection error";
          document.getElementById("friendsMsg").textContent = "";
          document.getElementById("currentUserName").textContent = "User";
          console.error(err);
        }
      }

      function buildUsersMap(currentUser, friends) {
        const map = {};
        if (currentUser && (currentUser.id != null || currentUser.user_id != null)) {
          const id = currentUser.id ?? currentUser.user_id;
          map[id] = currentUser;
        }
        friends.forEach((friend) => {
          const id = friend.id ?? friend.user_id;
          if (id != null) map[id] = friend;
        });
        return map;
      }

      function renderCurrentUser(user) {
        const userNameElem = document.getElementById("currentUserName");
        const userImgElem = document.getElementById("currentUserImg");

        if (!user) {
          userNameElem.textContent = "User";
          userImgElem.src = DEFAULT_AVATAR;
          return;
        }

        userImgElem.src = buildImageUrl(user.profile_picture);
        userImgElem.onerror = () => { userImgElem.src = DEFAULT_AVATAR; };

        const firstName = user.first_name || "";
        const lastName = user.last_name || "";
        const fullName = `${firstName} ${lastName}`.trim();

        userNameElem.textContent = fullName !== "" ? fullName : (user.name || user.username || "User");
      }

      function renderPosts(posts, usersById, currentUserId) {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";

        if (posts.length === 0) {
          container.innerHTML = '<div class="state-msg">No posts yet, write the first one!</div>';
          return;
        }

        posts.forEach((post) => {
          const author = usersById[post.user_id] || {};
          const firstName = post.first_name || author.first_name || '';
          const lastName = post.last_name || author.last_name || '';
          const authorName = (firstName + ' ' + lastName).trim() || author.name || author.username || 'Unknown';
          const authorPic = buildImageUrl(post.profile_picture || author.profile_picture);
          const postImage = post.image ? buildImageUrl(post.image) : null;

          const div = document.createElement("div");
          div.className = "post";
          div.innerHTML = `
            <div class="post_header">
              <div class="logo_profile">
                <img style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;"
                     src="${authorPic}"
                     onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}';"
                     alt="">
              </div>
              <div class="post_header_right">
                <h3 class="name">${escapeHtml(authorName)}</h3>
              </div>
              <div class="prag">
                <p style="margin: 0; letter-spacing: 1px; font-size: large">
                  ${escapeHtml(post.content || '')}
                </p>
              </div>
            </div>
            ${postImage ? `
            <div class="post_img">
              <img src="${postImage}" alt=""
                   style="width: 100%; height: 100%; border-radius: 8px; object-fit: cover;">
            </div>` : '<div class="post_img"></div>'}
            <div class="post_active">
              <li><i class="fa-regular fa-comment"></i></li>
              <li><i class="fa-solid fa-retweet"></i></li>
              <li><i class="fa-regular fa-heart"></i></li>
              <li><i class="fa-solid fa-arrow-up-from-bracket"></i></li>
            </div>
          `;
          container.appendChild(div);
        });
      }

      function renderFriends(friends, currentUserId) {
        const container = document.getElementById("friendsList");
        container.innerHTML = "";

        const filteredFriends = friends.filter((friend) => {
          const friendId = friend.id ?? friend.user_id;
          return String(friendId) !== String(currentUserId);
        });

        if (filteredFriends.length === 0) {
          container.innerHTML = '<div class="state-msg">No friends yet</div>';
          return;
        }

        filteredFriends.forEach((friend) => {
          const li = document.createElement("li");
          const friendName = `${friend.first_name || ''} ${friend.last_name || ''}`.trim();
          li.textContent = friendName || friend.name || "Friend";
          container.appendChild(li);
        });
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      const overlay = document.getElementById("createPostOverlay");
      const openModalBtn = document.getElementById("addPostTrigger");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const createPostForm = document.getElementById("createPostForm");
      const createPostError = document.getElementById("createPostError");
      const createPostSubmitBtn = document.getElementById("createPostSubmitBtn");

      openModalBtn.addEventListener("click", () => {
        overlay.classList.add("open");
      });

      closeModalBtn.addEventListener("click", closeModal);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
      });

      function closeModal() {
        overlay.classList.remove("open");
        createPostForm.reset();
        createPostError.textContent = "";
      }

      createPostForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        createPostError.textContent = "";

        const text = document.getElementById("postText").value.trim();
        const imageFile = document.getElementById("postImage").files[0];

        if (!text && !imageFile) {
          createPostError.textContent = "Write something or upload an image first";
          return;
        }

        createPostSubmitBtn.disabled = true;
        createPostSubmitBtn.textContent = "Posting...";

        try {
          const fd = new FormData();
          fd.append("text", text);
          if (imageFile) fd.append("image", imageFile);

          const response = await fetch(createPost, {
            method: "POST",
            headers: { "Authorization": token },
            body: fd
          });

          const data = await response.json();

          if (data.status === "success") {
            closeModal();
            loadHome(); 
          } else {
            createPostError.textContent = data.message || "Something went wrong, try again";
          }
        } catch (err) {
          createPostError.textContent = "Server connection error";
          console.error(err);
        } finally {
          createPostSubmitBtn.disabled = false;
          createPostSubmitBtn.textContent = "Post";
        }
      });

      loadHome();
    </script>
  </body>
</html>
