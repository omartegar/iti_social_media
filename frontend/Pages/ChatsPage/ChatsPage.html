<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="chat-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <h2>Chats</h2>
            <p>Messages</p>
          </div>

          <button class="theme-btn" id="themeBtn">☾</button>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search" />
        </div>

        <div class="friends">
          <!-- Comes from backend -->
          <div>
            <center>
              <p>Loading...</p>
            </center>
          </div>
        </div>
      </aside>

      <main class="chat-area">
        <div class="chat-empty-state">
          <div class="chat-empty-icon">&#9993;</div>
          <h1>Your conversations, in one place</h1>
          <p>Select a person from the left to open your private chat.</p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>

    <script type="module">
      import { getPrivateMessages, sendPrivateMessage } from "../../api.js";

      window.sendPrivateMessageUrl = sendPrivateMessage;

      async function openPrivateChat(userId) {
        const chatArea = document.getElementsByClassName("chat-area")[0];
        window.activeChatUserId = userId;
        const selectedFriend = [...document.querySelectorAll(".friend")].find(
          (friend) => String(friend.dataset.userId) === String(userId),
        );

        document.querySelectorAll(".friend").forEach((friend) => {
          friend.classList.toggle("active", friend === selectedFriend);
        });

        chatArea.innerHTML = `
          <div class="chat-loading-state">
            <div class="loading-spinner"></div>
            <p>Opening your conversation...</p>
          </div>`;

        try {
          const response = await fetch(getPrivateMessages + `?id=${userId}`, {
            method: "GET",
            headers: { Authorization: localStorage.getItem("token") },
          });
          const data = await response.json();

          if (data.status !== "success") {
            throw new Error(data.message || "Unable to load this conversation");
          }

          const receiver = data.receiver_data || {};
          const firstName = receiver.first_name || "User";
          const lastName = receiver.last_name || "";
          const fullName = `${firstName} ${lastName}`.trim();
          const avatarLetter = escapeHtml(firstName.charAt(0).toUpperCase());
          const messages = Array.isArray(data.messages) ? data.messages : [];

          chatArea.innerHTML = `
            <div class="chat-header">
              <div class="user-profile">
                <div class="avatar">${avatarLetter}</div>
                <div>
                  <h3>${escapeHtml(fullName)}</h3>
                  <span>Private conversation</span>
                </div>
              </div>
              <div class="chat-actions">
                <button class="info-btn" id="refreshChatBtn" type="button" aria-label="Refresh messages" title="Refresh messages">↻</button>
                <button class="info-btn" id="infoBtn" type="button" aria-label="Show profile" title="Show profile">ⓘ</button>
              </div>
            </div>

            <div class="profile-panel" id="profilePanel">
              <div class="profile-avatar">${avatarLetter}</div>
              <h2>${escapeHtml(fullName)}</h2>
              <p>Private conversation</p>
              <div class="profile-info">
                <div><span>Email</span><p>${escapeHtml(receiver.email || "Not available")}</p></div>
                <div><span>Phone</span><p>${escapeHtml(receiver.phone || "Not available")}</p></div>
                <div><span>About</span><p>Start a conversation and say hello.</p></div>
              </div>
            </div>

            <div class="messages" id="messages">
              ${renderMessages(messages, data.sender_me?.id)}
            </div>

            <div class="message-box">
              <input type="text" id="messageInput" placeholder="Write a message..." />
              <button id="sendBtn" type="button">Send</button>
              <span class="send-status" id="sendStatus" role="status"></span>
            </div>`;

          document.getElementById("messages").scrollTop =
            document.getElementById("messages").scrollHeight;
        } catch (error) {
          console.error(error);
          chatArea.innerHTML = `
            <div class="chat-error-state">
              <h2>Conversation unavailable</h2>
              <p>${escapeHtml(error.message)}</p>
            </div>`;
        }
      }

      window.refreshActiveChat = () => {
        if (window.activeChatUserId) {
          openPrivateChat(window.activeChatUserId);
        }
      };

      function renderMessages(messages, currentUserId) {
        if (messages.length === 0) {
          return `
            <div class="messages-empty-state">
              <div class="messages-empty-icon">&#10024;</div>
              <h2>No messages yet</h2>
              <p>Start the conversation with a friendly message.</p>
            </div>`;
        }

        return messages
          .slice()
          .reverse()
          .map((message) => {
            const isSent = String(message.sender_id) === String(currentUserId);
            return `
              <div class="message ${isSent ? "sent" : "received"}">
                <p>${escapeHtml(message.content || "")}</p>
                <span>${formatMessageTime(message.created_at)}</span>
              </div>`;
          })
          .join("");
      }

      function formatMessageTime(value) {
        if (!value) return "Time unavailable";
        const date = new Date(String(value).replace(" ", "T"));
        if (Number.isNaN(date.getTime())) return "Time unavailable";
        return new Intl.DateTimeFormat(undefined, {
          hour: "numeric",
          minute: "2-digit",
        }).format(date);
      }

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = String(value ?? "");
        return element.innerHTML;
      }

      window.openPrivateChat = openPrivateChat;
    </script>

    <script type="module">
      // BY Omar Ahmed Hashem
      import { showAllUsers } from "../../api.js";
      let allUsersFromBackend = [];
      let mySelf = {};
      let friendsList = document.getElementsByClassName("friends")[0];
      let chatsArea = document.getElementsByClassName("chat-area")[0];
      let rightChatArea = {
        name: document.getElementById("profileName"),
        email: document.getElementById("profileEmail"),
        phone: document.getElementById("profilePhone"),
      };

      async function requestAllUsersFromBackend() {
        const response = await fetch(showAllUsers, {
          method: "GET",
          headers: { Authorization: localStorage.getItem("token") },
        });

        const data = await response.json();

        if (data.status === "success") {
          console.log(data);
          allUsersFromBackend = data.users;
          mySelf = data.myself;

          friendsList.innerHTML = ""; // clear recent fake users

          data.users.map((user) => {
            if (user.id !== mySelf.id) {
              friendsList.innerHTML += `
            <div
            onclick = "openPrivateChat(${user.id})"
            class="friend"
            data-user-id="${user.id}"
            data-name="Ebtisam"
            data-status="Online"
            data-email="${user.email}"
            data-phone="+20 103 000 0000"
            data-about="Have a nice day!"
            data-message="Don't forget the meeting."
          >
            <div class="avatar">${user.first_name[0]}</div>

            <div class="friend-info">
              <h3>${user.first_name + " " + user.last_name}</h3>
              <p>Online</p>
            </div>
          </div>
            `;
            }
          });
        } else {
          console.error(data);
          alert(data.message);
        }
      }

      requestAllUsersFromBackend();
    </script>
  </body>
</html>
