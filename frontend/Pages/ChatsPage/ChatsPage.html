<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="chat-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <h2>Chats</h2>
            <p>Messages</p>
          </div>

          <button class="theme-btn" id="themeBtn">☾</button>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search" />
        </div>

        <div class="friends">
          <!-- Comes from backend -->
          <div>
            <center>
              <p>Loading...</p>
            </center>
          </div>
        </div>
      </aside>

      <main class="chat-area">
        <!-- Comes from backend response after choosing a user -->
      </main>
    </div>

    <script src="script.js"></script>

    <script type="module">
      import { getPrivateMessages } from "../../api.js";

      async function openPrivateChat(userId) {
        const chatArea = document.getElementsByClassName("chat-area")[0];
        chatArea.innerHTML = "<h2><center>Loading...</center></h2>";

        async function getUserDataAndMessage(userId) {
          const response = await fetch(getPrivateMessages + `?id=${userId}`, {
            method: "GET",
            headers: { Authorization: localStorage.getItem("token") },
          });

          const data = await response.json();
          if (data.status === "success") {
            console.log(data);
            let messages = data.messages; // an array
            chatArea.innerHTML = "";
            //   Append header
            chatArea.innerHTML += `
    <div class="chat-header">
          <div class="user-profile">
            <div class="avatar" id="chatAvatar">${data.receiver_data.first_name[0]}</div>

            <div>
              <h3 id="chatName">${data.receiver_data.first_name + " " + data.receiver_data.last_name}</h3>
              <span id="chatStatus">Status - Soon</span>
            </div>
          </div>

          <button class="info-btn" id="infoBtn">ⓘ</button>
        </div>`;

            // Append profile-panel
            chatArea.innerHTML += `
    <div class="profile-panel" id="profilePanel">
          <div class="profile-avatar" id="profileAvatar">${data.receiver_data.first_name[0]}</div>

          <h2 id="profileName">${data.receiver_data.first_name[0]}</h2>

          <p id="profileStatus">Soon:Online</p>

          <div class="profile-info">
            <div>
              <span>Email</span>
              <p id="profileEmail">${data.receiver_data.email}</p>
            </div>

            <div>
              <span>Phone</span>
              <p id="profilePhone">${data.receiver_data.phone}</p>
            </div>

            <div>
              <span>About</span>
              <p id="profileAbout">Hey there! I am using Messenger.</p>
            </div>
          </div>
        </div>

        <div class="messages" id="messages">
        
            <!-- ANA -->
            <div class="message sent">
              <p>I'm good, how about you?</p>
              <span>10:31 AM</span>
            </div>
            
            <!-- HWA -->
            <div class="message received">
              <p>Hello, how are you?</p>
              <span>10:30 AM</span>
            </div>

        <div class="message-box">
          <input
            type="text"
            id="messageInput"
            placeholder="Write a message..."
          />

          <button id="sendBtn">Send</button>
        </div>`;
          } else {
            console.error(data);
            alert(data.message);
            chatArea.innerHTML = `<h2><center>${data.message}</center></h2>`;
          }
        }

        getUserDataAndMessage(userId);
      }

      window.openPrivateChat = openPrivateChat;
    </script>

    <script type="module">
      // BY Omar Ahmed Hashem
      import { showAllUsers } from "../../api.js";
      let allUsersFromBackend = [];
      let mySelf = {};
      let friendsList = document.getElementsByClassName("friends")[0];
      let chatsArea = document.getElementsByClassName("chat-area")[0];
      let rightChatArea = {
        name: document.getElementById("profileName"),
        email: document.getElementById("profileEmail"),
        phone: document.getElementById("profilePhone"),
      };

      async function requestAllUsersFromBackend() {
        const response = await fetch(showAllUsers, {
          method: "GET",
          headers: { Authorization: localStorage.getItem("token") },
        });

        const data = await response.json();

        if (data.status === "success") {
          console.log(data);
          allUsersFromBackend = data.users;
          mySelf = data.myself;

          friendsList.innerHTML = ""; // clear recent fake users

          data.users.map((user) => {
            if (user.id !== mySelf.id) {
              friendsList.innerHTML += `
            <div
            onclick = "openPrivateChat(${user.id})"
            class="friend"
            data-name="Ebtisam"
            data-status="Online"
            data-email="${user.email}"
            data-phone="+20 103 000 0000"
            data-about="Have a nice day!"
            data-message="Don't forget the meeting."
          >
            <div class="avatar">${user.first_name[0]}</div>

            <div class="friend-info">
              <h3>${user.first_name + " " + user.last_name}</h3>
              <p>Online</p>
            </div>
          </div>
            `;
            }
          });
        } else {
          console.error(data);
          alert(data.message);
        }
      }

      requestAllUsersFromBackend();
    </script>
  </body>
</html>
