<!-- Image (circle), Fullname, Email, created_at date  -->


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Info</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 60px 16px;
        margin: 0;
    }
    .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 320px;
    }
    .avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 14px;
    }
    .name {
        font-size: 20px;
        font-weight: 600;
        color: #1c1e21;
        margin-bottom: 4px;
        word-break: break-word;
    }
    .email {
        font-size: 16px;
        font-weight: 500;
        color: #65676b;
        margin-bottom: 8px;
        word-break: break-word;
    }
    .joined {
        font-size: 14px;
        font-weight: 500;
        color: #65676b;
    }

    @media (max-width: 480px) {
        body {
            padding-top: 40px;
        }
        .avatar {
            width: 90px;
            height: 90px;
        }
        .name {
            font-size: 18px;
        }
        .email, .joined {
            font-size: 14px;
        }
    }
</style>
</head>
<body>
    <div class="profile">
        <img class="avatar" src="images/f547d800625af9056d62efe8969aeea0.jpg" alt="Profile picture">
        <div class="name">Name: Maria Victor</div>
        <div class="email">Email: Maria@gmail.com</div>
        <div class="joined">Created at: 07 Sep 2026</div>
    </div>
</body>
</html>
