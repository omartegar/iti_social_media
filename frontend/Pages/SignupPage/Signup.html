<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="signup-container">
      <h1>Create Account</h1>
      <p>Join our social media community</p>

      <form action="../HomePage/HomePage.html">
        <label for="firstname">First Name</label>
        <input
          type="text"
          id="firstname"
          name="firstname"
          placeholder="Enter your first name"
          required
        />

        <label for="lastname">Last Name</label>
        <input
          type="text"
          id="lastname"
          name="lastname"
          placeholder="Enter your last name"
          required
        />

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />

        <label for="phone">Phone</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
          required
        />

        <label for="image">Profile Image</label>
        <input type="file" id="image" name="image" accept="image/*" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          required
        />

        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Confirm your password"
          required
        />

        <p id="errorMessage">
          <!-- ERROR MESSAGE IF RETURNED BY BACKEND -->
        </p>
        <button type="submit">Sign Up</button>
      </form>

      <p>
        Already have an account?
        <a href="../LoginPage/Login.html">Login</a>
      </p>
    </div>

    <script type="module">
      import { signup } from "../../api.js";
      const form = document.forms[0];
      form.addEventListener("submit", (e) => {
        e.preventDefault(); // to stop default submit reload page
        requestDataToServer(); // to start the function to backend
      });

      const errorMessage = document.getElementById("errorMessage");
      const firstname = document.getElementById("firstname");
      const lastname = document.getElementById("lastname");
      const email = document.getElementById("email");
      const image = document.getElementById("image");
      const phone = document.getElementById("phone");
      const password = document.getElementById("password");
      const confirm_password = document.getElementById("confirm-password");

      async function requestDataToServer() {
        errorMessage.innerText = ""; // clear text on each start of function

        const fd = new FormData(); // This is used for forms only!
        fd.append("firstname", firstname.value);
        fd.append("lastname", lastname.value);
        fd.append("email", email.value);
        fd.append("password", password.value);
        fd.append("confirmpassword", confirm_password.value);
        fd.append("phone", phone.value);
        fd.append("image", image.files[0]); // ".files[0]" catch first image file uploaded from element

        const response = await fetch(signup, {
          method: "POST",
          body: fd,
        });

        const data = await response.json(); // this is an object returned from api(backend)

        if (data.status === "success") {
          // if account successfully created from backend
          console.log(data.message);
          errorMessage.innerText = data.message;
        } else {
          // if any error returned from backend
          console.log(data.message);
          errorMessage.innerText = data.message;
        }
      }
    </script>
  </body>
</html>
