<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="login-container">
      <h1>Welcome Back!</h1>
      <p>Login to your account</p>

      <form>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="id"
          placeholder="Enter your email"
          required
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <a href="forget-password.html">Forgot Password?</a>

        <p
          id="errorMessage"
          style="color: red; margin-top: 10px; font-size: 14px"
        ></p>

        <button type="submit">Login</button>
      </form>

      <p>
        Don't have an account?
        <a href="../SignupPage/Signup.html">Sign Up</a>
      </p>
    </div>

    <script type="module">
      import { login } from "../../api.js";

      const form = document.forms[0];

      const errorMessage = document.getElementById("errorMessage");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        requestLoginToServer();
      });

      async function requestLoginToServer() {
        errorMessage.innerText = "";

        const userData = {
          email: emailInput.value,
          password: passwordInput.value,
        };

        try {
          const fd = new FormData();
          fd.append("email", userData.email);
          fd.append("password", userData.password);

          const response = await fetch(login, {
            method: "POST",
            body: fd,
          });

          const data = await response.json();

          console.log("Response:", data);

          if (data.status === "success") {
            localStorage.setItem("token", data.token);
            console.log("Token saved:", data.token);
            window.location.href = "../HomePage/HomePage.html";
          } else {
            errorMessage.innerText = data.message;
          }
        } catch (error) {
          console.error("Error:", error);
          errorMessage.innerText = "Connection error";
        }
      }
    </script>
  </body>
</html>
